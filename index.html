<title>Truck Talk Admin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C1B18">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TT Admin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared/theme.css">
<style>
  /* ---------- Tokens (copied from ../index.html — keep in sync by eye,
     not by import, so the course site's CSS stays untouched) ---------- */
  :root{
    --paper:#F4F1E8;
    --surface:#FFFFFF;
    --surface-2:#EAE5D7;
    --ink:#1C1B18;
    --muted:#6B6459;
    --line:#DAD4C5;
    --accent:#E2691B;
    --accent-ink:#FFFFFF;
    --accent-2:#2E7D52;
    --danger:#B3402F;
    --shadow: 0 1px 2px rgba(28,27,24,0.06), 0 4px 14px rgba(28,27,24,0.06);
    --radius-s: 3px;
    --radius-m: 6px;
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#171816;
      --surface:#1F211F;
      --surface-2:#262824;
      --ink:#EDE8DC;
      --muted:#9C9488;
      --line:#34322C;
      --accent:#F0973C;
      --accent-ink:#1C1B18;
      --accent-2:#4CAF7D;
      --danger:#E27A68;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#171816;
    --surface:#1F211F;
    --surface-2:#262824;
    --ink:#EDE8DC;
    --muted:#9C9488;
    --line:#34322C;
    --accent:#F0973C;
    --accent-ink:#1C1B18;
    --accent-2:#4CAF7D;
    --danger:#E27A68;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.3);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.55;
  }
  h1,h2,h3{ font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.02em; text-wrap:balance; margin:0; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:var(--accent); }
  ::selection{ background:var(--accent); color:var(--accent-ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .brand-mark{
    font-family:var(--font-display); font-weight:700; font-size:1.2rem; letter-spacing:0.03em;
    background:var(--accent); color:var(--accent-ink); padding:2px 10px; border-radius:var(--radius-s);
  }

  /* ---------- Buttons / form controls (same look as the course site) ---------- */
  .btn{
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.03em; font-size:0.85rem;
    border-radius:var(--radius-s); border:2px solid var(--ink); padding:10px 18px; min-height:44px;
    background:var(--surface); color:var(--ink);
  }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-accent:hover:not(:disabled){ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover:not(:disabled){ border-color:var(--ink); }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:var(--danger); color:var(--surface); }
  .btn-sm{ padding:6px 12px; font-size:0.75rem; min-height:auto; }
  .select{ padding:8px 10px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:var(--font-body); }

  .stat-tile{
    background:var(--surface-2); border-radius:var(--radius-s); padding:12px 18px;
    display:flex; flex-direction:column; align-items:center; min-width:92px;
  }
  .stat-num{ font-family:var(--font-mono); font-weight:600; font-size:1.5rem; }
  .stat-label{ font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; text-align:center; }
  .stat-row{ display:flex; gap:10px; flex-wrap:wrap; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px; box-shadow:var(--shadow); margin-bottom:18px; }
  .panel-head{ margin-bottom:14px; }
  .panel-head h2{ font-size:1.15rem; margin-bottom:4px; }
  .panel-sub{ color:var(--muted); margin:0; font-size:0.9rem; }
  .panel-head-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .panel-head-row h2{ font-size:1.15rem; margin-bottom:4px; }

  /* ---------- Admin shell ---------- */
  .admin-shell{ display:flex; min-height:100vh; min-height:100dvh; align-items:stretch; }
  .admin-sidebar{
    width:200px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
    padding:18px 12px; display:flex; flex-direction:column; gap:22px;
  }
  .admin-brand{ display:flex; flex-direction:column; gap:6px; padding:0 6px; }
  .admin-brand-sub{ font-family:var(--font-mono); font-size:0.68rem; color:var(--muted); letter-spacing:0.1em; }
  .admin-nav{ display:flex; flex-direction:column; gap:2px; }
  .admin-nav-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:none; border:none; color:var(--muted); text-align:left;
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.04em; font-size:0.85rem;
    padding:11px 12px; border-radius:var(--radius-s);
  }
  .admin-nav-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .admin-nav-btn.active{ background:var(--ink); color:var(--accent-ink); }
  .admin-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .admin-topbar{
    display:flex; align-items:center; justify-content:flex-end; gap:12px;
    padding:14px 24px; border-bottom:1px solid var(--line);
  }
  .admin-role-pill{
    font-family:var(--font-mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em;
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:3px 9px; border-radius:99px;
  }
  .admin-user-name{ font-weight:600; margin-right:auto; }
  .admin-content{ max-width:960px; width:100%; margin:0 auto; padding:24px; }

  @media (max-width:760px){
    .admin-shell{ flex-direction:column; }
    .admin-sidebar{ width:100%; flex-direction:row; align-items:center; padding:10px 12px; border-right:none; border-bottom:1px solid var(--line); overflow-x:auto; }
    .admin-brand{ flex-direction:row; align-items:center; }
    .admin-nav{ flex-direction:row; }
    .admin-content{ padding:16px; }
    .admin-topbar{ padding:10px 16px; }
    .admin-user-name{ display:none; }
  }

  /* ---------- Users ---------- */
  .user-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:14px 4px; border-top:1px solid var(--line);
  }
  .user-row:first-of-type{ border-top:none; }
  .user-row-main{ display:flex; align-items:center; gap:10px; min-width:0; }
  .user-avatar{ width:32px; height:32px; border-radius:50%; flex-shrink:0; object-fit:cover; }
  .user-avatar-fallback{
    display:flex; align-items:center; justify-content:center; background:var(--surface-2);
    font-weight:700; color:var(--muted);
  }
  .user-name{ font-weight:600; display:block; }
  .user-email{ display:block; font-size:0.8rem; color:var(--muted); }
  .user-row-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .user-row-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .user-badge{
    font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; padding:3px 9px;
    border-radius:99px; background:var(--surface-2); color:var(--ink); white-space:nowrap;
  }
  .status-pending{ background:var(--accent); color:var(--accent-ink); }
  .status-approved{ background:var(--accent-2); color:#fff; }
  .status-restricted{ background:var(--danger); color:#fff; }
  .role-owner{ background:var(--ink); color:var(--accent-ink); }

  /* ---------- Tables ---------- */
  .table-wrap{ overflow-x:auto; }
  .admin-table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  .admin-table th{ text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .admin-table td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .admin-table tr:last-child td{ border-bottom:none; }

  .pick-list{ display:flex; flex-direction:column; }
  .pick-row{
    display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left;
    background:none; border:none; border-top:1px solid var(--line); padding:12px 4px; color:var(--ink); font-size:0.92rem;
  }
  .pick-row:first-child{ border-top:none; }
  .pick-row:hover{ background:var(--surface-2); }

  /* ---------- Calendar ---------- */
  .cal-group{ padding:14px 0; border-top:1px solid var(--line); }
  .cal-group:first-of-type{ border-top:none; padding-top:0; }
  .cal-date{ font-size:0.8rem; color:var(--muted); margin-bottom:10px; }
  .cal-event{
    display:flex; gap:14px; align-items:flex-start; padding:10px; border-radius:var(--radius-s);
    background:var(--surface-2); margin-bottom:8px; cursor:pointer;
  }
  .cal-event:hover{ filter:brightness(0.98); }
  .cal-event-time{ font-family:var(--font-mono); font-size:0.8rem; color:var(--muted); white-space:nowrap; padding-top:2px; }
  .cal-event-title{ font-weight:600; display:block; }
  .cal-event-students{ display:block; font-size:0.8rem; color:var(--muted); }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:100; overflow-y:auto;
  }
  .modal-card{
    width:100%; max-width:440px; background:var(--surface); border-radius:var(--radius-m);
    padding:26px; box-shadow:var(--shadow); max-height:calc(100vh - 40px); overflow-y:auto;
  }
  .modal-card h2{ font-size:1.1rem; margin-bottom:6px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .role-choice{ display:flex; gap:16px; margin:6px 0 4px; font-size:0.9rem; }
  .role-choice label{ display:flex; align-items:center; gap:6px; }

  #toast{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px);
    background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:var(--radius-s);
    font-size:0.88rem; opacity:0; pointer-events:none; transition:opacity 0.25s, transform 0.25s;
    max-width:90vw; text-align:center; box-shadow:var(--shadow); z-index:200;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>

<div id="authRoot"></div>

<div id="appShell" hidden></div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script type="module" src="admin.js"></script>
<script>
  if ("serviceWorker" in navigator){
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }
</script>
